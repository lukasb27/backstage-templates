[tox]
envlist =
    py313
    lint
skipsdist = True

[testenv]
description = run the tests with pytest
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install
commands =
    poetry run pytest -m "not e2e" {posargs:tests}

[testenv:lint]
description = run linting with flake8
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install
commands =
    poetry run flake8 app/ tests/

[testenv:format]
description = run formatters
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install
commands =
    poetry run black app/ tests/
    poetry run isort app/ tests/

[project]
name = "${{ values.name }}"
version = "0.1.0"
description = "${{ values.description }}"
authors = [
    {name = "${{ values.owner }}"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic (>=2.10.5,<3.0.0)",
    "fastapi (>=0.115.8,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.4,<9.0.0"
pytest-asyncio = ">=0.25.2,<0.26.0"
pytest-cov = ">=6.0.0,<7.0.0"
black = ">=24.10.0,<25.0.0"
isort = ">=5.13.2,<6.0.0"
flake8 = ">=7.1.1,<8.0.0"

[tool.poetry.group.integ-test]
optional = true

[tool.poetry.group.integ-test.dependencies]
httpx = ">=0.28.1,<0.29.0"
pytest = ">=8.3.4,<9.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests that exercise the FastAPI app in-process via httpx, no external boundaries",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.isort]
profile = "black"

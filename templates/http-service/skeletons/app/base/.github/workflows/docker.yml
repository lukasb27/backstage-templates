name: docker

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lukasb27/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Docker meta (integ-tests)
        id: meta-integ-tests
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lukasb27/${{ github.event.repository.name }}-integ-tests
          tags: |
            type=ref,event=branch
            type=sha

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push (integ-tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: true
          tags: ${{ steps.meta-integ-tests.outputs.tags }}
          labels: ${{ steps.meta-integ-tests.outputs.labels }}

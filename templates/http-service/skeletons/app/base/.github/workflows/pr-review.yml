# Advisory code review with Claude — posts a comment, never blocks a merge.
# Opt-in per PR via a label (mirrors claude-issue-triage.yml exactly), not a
# fire-on-every-push trigger — Haiku is cheap (~$0.07/run per
# language-teacher/docs/github-issue-triage.md's real cost data) but a
# review on every `synchronize` on an actively-iterated PR adds up fast for
# no reason if nobody's going to read most of them.
#
# Deliberately NOT a required status check (not in protect-branch's
# requiredStatusCheckContexts in template.yaml, and shouldn't be added).
# This is designed to soft-pass on quota, rate limits, a missing
# ANTHROPIC_API_KEY, and anything else that could make it fail — a check
# designed to always pass, made mandatory, is a green tick that carries no
# information on every merge's critical path. It's a comment; comments are
# useful on their own, without gating anything.
#
# Same three operational requirements as claude-issue-triage.yml, learned
# there from real failed runs (see that file's comments and
# language-teacher/docs/github-issue-triage.md for the full history) —
# apply here identically:
#   1. `claude_args: "--model ... --max-turns N"`, not top-level `max_turns`/
#      `allowed_tools` — those are silently ignored and it falls back to a
#      more expensive default model with no cap.
#   2. `track_progress: true` — a custom `prompt` puts the action in
#      "automation mode", which posts nothing without this.
#   3. The official Claude GitHub App installed
#      (https://github.com/apps/claude) + `id-token: write` in this job's
#      permissions, for the OIDC exchange the App requires.
#
# Read-only by design, same as claude-issue-triage.yml: no Bash tool, so
# Claude reviews by reading the diff, not by running tests, linters, or git
# commands — `ci` already runs the real checks; this is a second pair of
# eyes on the diff itself, not a re-run of the pipeline.
#
# Not yet independently verified whether track_progress's tracking comment
# gets reused across multiple runs on the same PR (e.g. re-labeling after a
# later push) or whether each run posts its own — worth checking the first
# time this fires twice on one real PR, same way the duplicate-comment issue
# in post_report_to_pr.py (integration_tests/) was only found by watching it
# run live.
#
# The diff is computed here and embedded directly in the prompt, rather than
# leaving Claude to find it. Confirmed live 2026-08-16 (real run trace, not
# assumed): the action's own system prompt already lists changed files and
# +/- line counts before any tool call, but not the actual diff content — for
# a real change (not the trivial 2-line one this was first tested against),
# Claude would otherwise burn turns reading whole files just to reconstruct
# what changed. Handing it the exact diff text upfront should only ever
# reduce or match turns needed for extra context, never increase them, since
# the same follow-up exploration would still happen either way — but that's
# reasoning, not proof; re-check real cost/turn numbers the first time this
# runs against a real, non-trivial diff. Truncated to 8000 chars as a safety
# cap against a single huge diff blowing up prompt size/cost in the opposite
# direction.

name: Claude PR Review

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'needs-review' ||
      github.event.label.name == 'needs-review-sonnet' ||
      github.event.label.name == 'needs-review-opus'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick model
        id: pick-model
        run: |
          case "${{ github.event.label.name }}" in
            needs-review-sonnet)
              echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
              ;;
            needs-review-opus)
              echo "model=claude-opus-5" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "model=claude-haiku-4-5-20251001" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Remove review label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: "${{ github.event.label.name }}",
            }).catch(() => {});

      - name: Compute PR diff
        id: pr-diff
        run: |
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
          DELIM="diff_$(date +%s%N)"
          {
            echo "content<<${DELIM}"
            head -c 8000 /tmp/pr.diff
            if [ "$(wc -c < /tmp/pr.diff)" -gt 8000 ]; then
              echo ""
              echo "... (truncated at 8000 chars, $(wc -c < /tmp/pr.diff) total)"
            fi
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Review PR with Claude
        # continue-on-error: this is advisory only — a quota/rate-limit/
        # missing-secret failure here must never fail the job or block
        # anything. See the file header for why this isn't a required check.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          claude_args: "--model ${{ steps.pick-model.outputs.model }} --max-turns 8"
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            in this repository: "${{ github.event.pull_request.title }}".

            Here is the full diff for this PR:

            ```diff
            ${{ steps.pr-diff.outputs.content }}
            ```

            You can also read and search the rest of the repository for
            context (e.g. checking how a changed function is called
            elsewhere), but you cannot execute commands (no Bash access) —
            `ci` already runs the real tests/linters on this PR; review the
            diff itself, don't try to re-run the pipeline.

            Look for: correctness bugs, obvious simplification or
            reuse opportunities, and anything that looks inconsistent with
            the rest of the codebase's existing patterns. Skip nitpicks
            that don't affect correctness or maintainability.

            Do NOT modify any files, create a branch, or commit. Respond
            with:
              1. A one-sentence summary verdict (looks good / has concerns)
              2. Specific findings, each with a file:line reference and a
                 concrete description of the problem — skip this section
                 entirely if you found nothing worth flagging
              3. Anything you couldn't fully verify without running code

name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # The default GITHUB_TOKEN's pushes/merges don't trigger other
          # workflows (a GitHub anti-loop rule) — without a real PAT here,
          # release-please's own merge commit to main would never fire
          # docker.yml, and a tagged release would never get built.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: python

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  # Quoted + defaulted: an unquoted, blank value here renders as YAML null,
  # which fails catalog registration ("Malformed envelope, /metadata/description
  # must be string") — description is an optional parameter, so a blank
  # submission is a normal, expected case, not user error.
  description: '${{ values.description | default("") }}'
  annotations:
    github.com/project-slug: '${{ (values.destination | parseRepoUrl).owner }}/${{ values.name }}'
    backstage.io/kubernetes-id: ${{ values.name }}
    backstage.io/techdocs-ref: dir:.
    goldenpath.lukasb27/template-version: '${{ values.template_version }}'
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
{%- if values.system %}
  system: ${{ values.system }}
{%- endif %}

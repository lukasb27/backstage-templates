site_name: '${{ values.name }}'
site_description: '${{ values.description }}'
nav:
  - Home: index.md
  - Architecture: architecture.md
plugins:
  - techdocs-core
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
